name: Build real dental models

on:
  push:
    branches:
      - feature/real-dental-models

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/real-dental-models
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: _source
        run: npm install
      - name: Build website assets
        working-directory: _source
        run: npm run build
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js assets/css
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build real dental model assets"
            git push
          fi
